# =============================================================================
# Host #3 — parisunitedgroup.com + www  (PUG corporate website + HR ATS)
# =============================================================================
# DROP-IN for the Employee-Housing portal's multi-vhost nginx.conf
# (C:\Apps\Employee-Housing-Control-Portal\deploy\nginx.conf). Replaces the
# commented "Host #3" placeholder that file ships.
#
# Pairs with docker-compose.webserver-local.yml (project ``pugweb``), which
# publishes the corporate site on the shared ``pug_edge`` docker network as:
#       pugweb-api:8000        FastAPI  (gunicorn + uvicorn workers)
#       pugweb-frontend:3000   Next.js  (next start)
#
# ── Resolver pattern (NO ``upstream`` blocks) — important on a shared host ──
# We resolve the PUG hostnames at REQUEST time via Docker's embedded DNS
# (127.0.0.11) instead of static ``upstream { server pugweb-api:8000; }``
# blocks. Two big wins when the two stacks restart independently:
#   1. nginx STARTS even if the PUG stack is down. A static upstream that
#      can't resolve makes nginx fail to boot — which would take the
#      ACCOMMODATION site (Host #1) down with it. The resolver pattern just
#      returns 502 for parisunitedgroup.com and leaves Host #1 serving.
#   2. NO nginx reload needed after a PUG redeploy — nginx re-resolves the
#      recreated container's new IP automatically (within the TTL).
#
# ── Install (2 edits to nginx.conf, then REBUILD nginx) ─────────────────────
#   1. :80 REDIRECT — add ``parisunitedgroup.com www.parisunitedgroup.com`` to
#      the ``server_name`` of the existing ``listen 80`` redirect block.
#   2. Paste the ``server { … }`` block below after the Host #1 server block.
#      (No ``upstream`` blocks to add — delete the commented pugweb_* stubs.)
#   Then, because this nginx BAKES nginx.conf into its image (build:
#   Dockerfile.nginx), apply it with a REBUILD — a plain reload won't see the
#   host-side edit:
#       docker compose -f docker-compose.prod.yml up -d --build nginx
#   (The PUG stack must be up on pug_edge first — it is, once
#   ``docker compose -f docker-compose.webserver-local.yml up -d`` has run.)
#
# ── No Content-Security-Policy here ─────────────────────────────────────────
# The Next.js app emits its OWN complete CSP (Google Fonts, GA / Meta / TikTok
# / LinkedIn / Clarity, R2 media, Maps, YouTube) — see frontend/next.config.mjs.
# A second, stricter nginx CSP would INTERSECT with it and silently break
# fonts / analytics / images. (security-headers.conf still adds HSTS /
# X-Frame-Options / nosniff, which the app also sets — duplicates are harmless.)
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parisunitedgroup.com www.parisunitedgroup.com;

    # Reject anything that didn't arrive via the Cloudflare edge / tunnel.
    # (Behind Cloudflare Tunnel the peer is 127.0.0.1, already allow-listed by
    # the $cf_edge geo map at the top of this file.)
    if ($cf_edge = 0) {
        return 403;
    }

    # www -> apex (apex is canonical for SEO + cookie scope).
    if ($host = www.parisunitedgroup.com) {
        return 301 https://parisunitedgroup.com$request_uri;
    }

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Matches the backend's MAX_UPLOAD_SIZE_MB (20) + multipart overhead.
    client_max_body_size 25M;

    # Docker's embedded DNS. Lets the ``set $var`` + variable ``proxy_pass``
    # below re-resolve the PUG containers on every request (subject to the
    # TTL), so PUG redeploys are picked up with no nginx restart, and a PUG
    # outage can't stop nginx from booting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ----- HR realtime WebSocket (Phase C-2: /api/v1/ws/notifications) -----
    location /api/v1/ws/ {
        include /etc/nginx/snippets/proxy-common.conf;
        set $pugweb_api pugweb-api:8000;
        proxy_pass         http://$pugweb_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- FastAPI backend (also serves /api/v1/uploads/ in local-disk mode) -----
    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        set $pugweb_api pugweb-api:8000;
        proxy_pass         http://$pugweb_api$request_uri;
        # SSE: the streaming "Ask PUG AI" endpoint emits text/event-stream;
        # buffering on would coalesce chunks and break token-by-token render.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ----- Next.js immutable static chunks (content-hashed filenames) -----
    location /_next/static/ {
        include /etc/nginx/snippets/proxy-common.conf;
        set $pugweb_frontend pugweb-frontend:3000;
        proxy_pass http://$pugweb_frontend$request_uri;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- Next.js frontend (catch-all, SSR) -----
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        set $pugweb_frontend pugweb-frontend:3000;
        proxy_pass         http://$pugweb_frontend$request_uri;
        proxy_read_timeout 600s;
    }
}
