# =============================================================================
# Host #3 — parisunitedgroup.com + www  (PUG corporate website + HR ATS)
# =============================================================================
# DROP-IN for the Employee-Housing portal's multi-vhost nginx.conf
# (C:\Apps\Employee-Housing-Control-Portal\deploy\nginx.conf). It replaces
# the commented "Host #3" placeholder that file already ships.
#
# Pairs with docker-compose.webserver-local.yml in the PUGHoldingWebSite
# repo, which publishes the corporate site on the shared ``pug_edge`` docker
# network under these exact names:
#       pugweb-api:8000        FastAPI  (gunicorn + uvicorn workers)
#       pugweb-frontend:3000   Next.js  (next start)
#
# ── Install (3 edits to the housing nginx.conf, then reload) ────────────────
#   1. UPSTREAMS: paste the two ``upstream`` blocks below into the
#      "Upstreams" section near the top (alongside pug_backend /
#      pug_frontend). Leave the file's own commented pugweb_* stubs deleted
#      or replaced — don't define the same upstream twice.
#   2. :80 REDIRECT: add ``parisunitedgroup.com www.parisunitedgroup.com``
#      to the ``server_name`` list of the existing ``listen 80`` block so a
#      stray plain-HTTP hit is redirected to https://<itself>.
#   3. SERVER BLOCK: paste the ``server { … }`` block below after Host #1.
#   Then validate + reload nginx (inside its container):
#       docker exec <housing-nginx> nginx -t
#       docker exec <housing-nginx> nginx -s reload
#
# ── Why no Content-Security-Policy here ─────────────────────────────────────
# The Next.js app emits its OWN, complete CSP (see frontend/next.config.mjs)
# that allows Google Fonts, GA / Meta / TikTok / LinkedIn / Clarity, R2
# media, Google Maps and YouTube. Adding a second, stricter CSP at nginx
# (like Host #1's) would INTERSECT with the app's and silently break fonts,
# analytics and images. So this vhost deliberately omits ``add_header
# Content-Security-Policy``. (security-headers.conf still supplies HSTS /
# X-Frame-Options / nosniff, which the app also sets — duplicates of those
# are harmless.)
#
# ── Operational note (static upstream IP caching) ───────────────────────────
# nginx resolves these upstream hostnames ONCE at startup. After you
# (re)deploy the PUG web stack (``up -d`` recreates the containers with new
# IPs), reload nginx so it re-resolves:  docker exec <housing-nginx> nginx -s reload
# =============================================================================


# ---------------------------------------------------------------------------
# UPSTREAMS  — paste into the upstreams section near the top of nginx.conf.
# ---------------------------------------------------------------------------
upstream pugweb_api {
    server pugweb-api:8000;
    keepalive 32;
}
upstream pugweb_frontend {
    server pugweb-frontend:3000;
    keepalive 32;
}


# ---------------------------------------------------------------------------
# SERVER BLOCK — paste after the Host #1 server block.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parisunitedgroup.com www.parisunitedgroup.com;

    # Reject anything that didn't arrive via the Cloudflare edge / tunnel.
    # (Behind Cloudflare Tunnel the peer is 127.0.0.1, which the $cf_edge
    # geo map at the top of this file already allow-lists.)
    if ($cf_edge = 0) {
        return 403;
    }

    # www -> apex (apex is canonical for SEO + cookie scope). A bare
    # ``return`` inside ``if`` is the supported, non-evil idiom.
    if ($host = www.parisunitedgroup.com) {
        return 301 https://parisunitedgroup.com$request_uri;
    }

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Matches the backend's MAX_UPLOAD_SIZE_MB (20) + multipart overhead.
    client_max_body_size 25M;

    # ----- HR realtime WebSocket (Phase C-2: /api/v1/ws/notifications) -----
    # Separate from /api/ because it needs the Upgrade/Connection headers
    # and a long read timeout. proxy_set_header at this level drops the
    # inherited set, so we re-include proxy-common.conf here too.
    location /api/v1/ws/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://pugweb_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- FastAPI backend -----
    # Also serves /api/v1/uploads/... in local-disk mode; R2-backed installs
    # serve media straight from the R2 domain so it never reaches here.
    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://pugweb_api;

        # SSE: the streaming "Ask PUG AI" endpoint emits text/event-stream.
        # Buffering on would coalesce chunks and break token-by-token render.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ----- Next.js immutable static chunks (content-hashed filenames) -----
    location /_next/static/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://pugweb_frontend;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- Next.js frontend (catch-all, SSR) -----
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://pugweb_frontend;
        proxy_read_timeout 600s;
    }
}
