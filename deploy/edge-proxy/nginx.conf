# =============================================================================
# Edge reverse proxy — standalone multi-vhost config (MOUNTED, not baked).
#
# Hosts terminated here:
#   accommodation.parisunitedgroup.com  -> Employee Housing Control Portal
#   parisunitedgroup.com / www.         -> PUG corporate site + HR ATS
#   pugfin.parisunitedgroup.com         -> PUG Finance app          (planned)
#
# Every app's backend/frontend is reached over the shared ``pug_edge`` network
# by a stable DNS alias, resolved AT REQUEST TIME via Docker's embedded DNS
# (resolver 127.0.0.11). That means this proxy boots even if an app is down
# (its host just 502s, the others keep serving) and picks up app redeploys
# with no reload.
#
# Edit this file then:  docker exec edge-proxy-nginx-1 nginx -s reload
# =============================================================================

# --- Real-client-IP — trust the Cloudflare edge ranges only ------------------
# Keep in sync with https://www.cloudflare.com/ips-v4 + ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# --- Hard allowlist: only the Cloudflare edge / tunnel may connect -----------
# Keyed on $realip_remote_addr (the ORIGINAL peer) — preserved as the CF edge
# IP (direct DNS) or 127.0.0.1 (Cloudflare Tunnel); both are allow-listed.
geo $realip_remote_addr $cf_edge {
    default 0;
    173.245.48.0/20    1;
    103.21.244.0/22    1;
    103.22.200.0/22    1;
    103.31.4.0/22      1;
    141.101.64.0/18    1;
    108.162.192.0/18   1;
    190.93.240.0/20    1;
    188.114.96.0/20    1;
    197.234.240.0/22   1;
    198.41.128.0/17    1;
    162.158.0.0/15     1;
    104.16.0.0/13      1;
    104.24.0.0/14      1;
    172.64.0.0/13      1;
    131.0.72.0/22      1;
    2400:cb00::/32     1;
    2606:4700::/32     1;
    2803:f800::/32     1;
    2405:b500::/32     1;
    2405:8100::/32     1;
    2a06:98c0::/29     1;
    2c0f:f248::/32     1;
    # Docker internal networks — for `docker exec` smoke tests + the tunnel.
    172.16.0.0/12      1;
    10.0.0.0/8         1;
    127.0.0.1/32       1;
}

# --- Shared TLS session cache + gzip (http level) ----------------------------
ssl_session_cache   shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

gzip on;
gzip_types text/plain application/json application/javascript text/css image/svg+xml application/xml;
gzip_min_length 1024;

# --- Docker embedded DNS — request-time resolution of the app aliases --------
resolver         127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# --- 80 -> 301 https (and a plain-HTTP health probe for the container) -------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name accommodation.parisunitedgroup.com
                parisunitedgroup.com
                www.parisunitedgroup.com;
    #            pugfin.parisunitedgroup.com   (add when the finance app is live)

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Default 443 — unknown SNI / direct-IP probes get the connection dropped -
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/ssl-common.conf;
    return 444;
}

# =============================================================================
# Host #1 — accommodation.parisunitedgroup.com (Employee Housing Portal).
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name accommodation.parisunitedgroup.com;

    if ($cf_edge = 0) {
        return 403;
    }

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 30M;

    # Reached over pug_edge by the aliases the housing compose now exposes.
    set $housing_backend  housing-backend:5000;
    set $housing_frontend housing-frontend:3000;

    location = /health {
        proxy_pass http://$housing_backend/api/v1/health;
        access_log off;
    }

    location ~ ^/api/v1/attachments/[0-9]+/download$ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://$housing_backend$request_uri;
        proxy_read_timeout 120s;
        proxy_hide_header  Content-Disposition;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering    off;   # SSE: /api/v1/events/stream
        proxy_cache        off;
        proxy_read_timeout 1h;
        proxy_pass         http://$housing_backend$request_uri;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://$housing_frontend$request_uri;
        proxy_read_timeout 60s;
    }
}

# =============================================================================
# Host #2 — parisunitedgroup.com + www. (PUG corporate website + HR ATS).
#
# No Content-Security-Policy here: the Next.js app emits its own complete CSP.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parisunitedgroup.com www.parisunitedgroup.com;

    if ($cf_edge = 0) {
        return 403;
    }

    if ($host = www.parisunitedgroup.com) {
        return 301 https://parisunitedgroup.com$request_uri;
    }

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 25M;

    set $pugweb_api      pugweb-api:8000;
    set $pugweb_frontend pugweb-frontend:3000;

    # HR realtime WebSocket — headers set explicitly (NOT via proxy-common.conf)
    # so we don't duplicate proxy_http_version / fight the Connection header.
    location /api/v1/ws/ {
        set $pugweb_api pugweb-api:8000;
        proxy_pass         http://$pugweb_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://$pugweb_api$request_uri;
        proxy_buffering    off;   # SSE: streaming "Ask PUG AI"
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://$pugweb_frontend$request_uri;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass         http://$pugweb_frontend$request_uri;
        proxy_read_timeout 600s;
    }
}

