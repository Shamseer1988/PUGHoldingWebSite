# ============================================================================
# Edge reverse proxy — standalone, shared by every app on this host.
# ============================================================================
# A single nginx that terminates TLS (Cloudflare Origin cert) and routes to
# each app over the shared ``pug_edge`` docker network. It is NOT part of any
# app's compose project, and its config is MOUNTED (not baked) — so editing
# ./nginx.conf then running
#     docker exec edge-proxy-nginx-1 nginx -s reload
# applies changes with NO rebuild.
#
# Routes (see nginx.conf):
#   accommodation.parisunitedgroup.com -> housing-backend:5000 / housing-frontend:3000
#   parisunitedgroup.com (+ www)        -> pugweb-api:8000     / pugweb-frontend:3000
#   pugfin.parisunitedgroup.com         -> (planned)
#
# Files in this folder (copy them to C:\Apps\edge-proxy\ on the host):
#   docker-compose.yml   this file
#   nginx.conf           the multi-vhost config (mounted read-only)
#   snippets/            ssl-common.conf, security-headers.conf, proxy-common.conf
#   ssl/                 origin.crt + origin.key (Cloudflare Origin Certificate)
#
# Bring up:    docker compose up -d
# Reload cfg:  docker exec edge-proxy-nginx-1 nginx -s reload
# Test cfg:    docker exec edge-proxy-nginx-1 nginx -t
# ============================================================================

name: edge-proxy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # This nginx owns the host's public ports. Only ONE container can bind
    # them, so the old app-embedded nginx must be removed first (see README).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edge

networks:
  # The shared network every app's backend/frontend also joins. Created once
  # with ``docker network create pug_edge`` (already exists on this host).
  edge:
    external: true
    name: pug_edge
