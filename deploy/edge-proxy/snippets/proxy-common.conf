# Common reverse-proxy headers + HTTP/1.1 (needed for keepalive and for the
# WebSocket upgrade). Do NOT re-declare ``proxy_http_version`` in a location
# that includes this file — it's a single-value directive and a second
# declaration is a fatal "duplicate directive" (the WebSocket location below
# therefore sets its headers explicitly instead of including this snippet).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Empty Connection clears the client's keep-alive header for upstream pooling;
# the WebSocket location overrides this with Connection "upgrade".
proxy_set_header Connection        "";
