# Baseline security headers shared by the vhosts. Apps that emit their own
# (e.g. the Next.js corporate site sets its own CSP / X-Frame-Options) will
# produce duplicates of some of these — harmless; the browser takes the
# strictest. Keep CSP OUT of here so it can be tuned per vhost.
add_header X-Frame-Options           "SAMEORIGIN"                          always;
add_header X-Content-Type-Options    "nosniff"                             always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
